[metadata]
name = Melani Spanish
keywords = plover plover_plugin spanish

[options]
zip_safe = True
setup_requires =
  setuptools>=79.0.0 # just an example, might need to be higher
install_requires =
  plover>=4.0.0.dev10 # or higher, especially for GUI plugins
  plover_stroke>=0.4.0
  plover_python_dictionary>=0.5.6
include_package_data = True
packages =
  plover_melani_es
  plover_melani_es.dictionaries

[options.entry_points]
plover.system = 
  Melani Spanish = plover_melani_es.system
