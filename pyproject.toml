[project]
name = "plover_melani_es"
version = "0.3.0"
authors = [
    {name = "Raúl E. Taveras", email = "raul@raultaveras.online"}
]
description = "Implementation of the Melani system for Spanish stenography according to public information."
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license_files = ["LICENSE"]
readme = "README.md"
keywords = ["plover", "plover_plugin", "spanish"]
dependencies = [
    "plover>=5.0.0",
    "plover_stroke>=0.4.0",
    "plover_python_dictionary>=0.5.6",
]

[project.urls]
Homepage = "https://github.com/rauletaveras/plover_melani_spanish"
Issues = "https://github.com/rauletaveras/plover_melani_spanish/issues"

[project.entry-points."plover.system"]
"MelaniES" = "plover_melani_es.system"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["plover_melani_es", "plover_melani_es.dictionaries"]
