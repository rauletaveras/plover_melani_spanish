name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      run: uv sync --all-extras
    - name: Run tests
      run: uv run pytest
    - name: Build
      run: uv build
    - name: Verify artifacts
      run: |
        pip install twine
        twine check dist/*
    - name: Publish
      run: uv publish
    - name: Create Release
      run: |
        if ("${{ github.ref }}" -like "*-dev") {
          gh release create "${{ github.ref_name }}" --prerelease
        } else {
          gh release create "${{ github.ref_name }}"
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
