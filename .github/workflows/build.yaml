name: Python package

on:
  push:

    branches:
    - main

  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install 3.10
    - name: Install dependencies
      run: uv sync --all-extras
    - name: Run tests
      run: uv run pytest
    - name: Run linting
      run: uv run ruff check
    - name: Run type checking
      run: uv run pyright
